name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
